services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ENV=production
      - YOUTUBE_ENABLED=${YOUTUBE_ENABLED:-false}
      - DAILY_QUOTA_PER_IP=${DAILY_QUOTA_PER_IP:-50}
      - DOWNLOADS_MAX_GB=${DOWNLOADS_MAX_GB:-10}
    depends_on:
      - redis
    volumes:
      - downloads:/app/downloads
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Trimmed for satellite-B (shared infra): one worker consuming every queue,
  # instead of the VPS's 4 specialized workers (downloads/light/media/analysis).
  # Split back out once real load justifies the extra resource footprint.
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info -Q downloads,celery,media,analysis --concurrency=${CELERY_CONCURRENCY:-4} --max-tasks-per-child=50
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DOWNLOADS_MAX_GB=${DOWNLOADS_MAX_GB:-10}
    depends_on:
      - redis
      - backend
    volumes:
      - downloads:/app/downloads
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: celery -A app.core.celery_app.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler --pidfile=/tmp/celerybeat.pid
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - DOWNLOADS_MAX_GB=${DOWNLOADS_MAX_GB:-10}
    depends_on:
      - redis
      - celery-worker
    volumes:
      - downloads:/app/downloads
    healthcheck:
      test: ["CMD", "python3", "-c", "import os; exit(0 if os.path.exists('/tmp/celerybeat.pid') else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
        - VITE_API_URL=
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - mb-edge
      - default
    labels:
      - traefik.enable=true
      - traefik.docker.network=mb-edge
      - "traefik.http.routers.${STACK}.rule=Host(`${STACK}.b.matbao.ai`)"
      - traefik.http.routers.${STACK}.entrypoints=websecure
      - traefik.http.routers.${STACK}.tls.certresolver=le
      - traefik.http.services.${STACK}.loadbalancer.server.port=80

networks:
  mb-edge:
    external: true
  default:

volumes:
  redis-data:
  downloads:
