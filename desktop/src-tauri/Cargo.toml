[package]
name = "vidgrab-desktop"
version = "0.10.0"
description = "VidGrab desktop client (Phase 32C, stage C1)"
edition = "2021"
rust-version = "1.88"

[lib]
# Tauri 2 template layout: logic lives in the lib, main.rs only calls run().
name = "vidgrab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"
# Decodes VIDGRAB_CLAIM_PUBKEYS at build time (claim_keys.rs, PLAN-32E P3).
base64 = "0.22"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
# Toasts for channel checks; called from Rust only (no notification:*
# permission is granted to the webview).
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
# OS CSPRNG for the browser sign-in `state` (browser_login.rs).
getrandom = "0.3"
# Local history DB; "bundled" compiles SQLite in, no system library needed.
rusqlite = { version = "0.40", features = ["bundled"] }
# PLAN-32E P3 (task #6172): verify the server's Ed25519 claim tokens / policy.
ed25519-dalek = "2"
base64 = "0.22"
# Rust's own GET /client/version (policy). rustls + the bundled Mozilla roots
# (webpki-roots), NOT the Windows store: a CA the user installs for a fake API
# server (mitmproxy) is trusted by the webview but not here.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
# Off in C0 (unsigned installer, no updater key yet). Build with
# `--features updater` once the key pair exists (stage C2).
tauri-plugin-updater = { version = "2", optional = true }
# Per-user "start with Windows" (HKCU Run key, no admin); driven from Rust only.
tauri-plugin-autostart = "2"
# A second launch focuses the running window instead of starting another app.
tauri-plugin-single-instance = "2"

[features]
default = []
updater = ["dep:tauri-plugin-updater"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  # DPAPI (CryptProtectData) for the saved platform cookies (cookies.rs).
  "Win32_Security_Cryptography",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# Session storage in Windows Credential Manager. keyring 4's `v1` API picks
# the windows-native store (keyring-core + windows-native-keyring-store) on
# Windows; it is declared for Windows only so Linux dev/test builds do not
# pull the D-Bus secret-service stack.
keyring = { version = "4", default-features = false, features = ["v1"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
