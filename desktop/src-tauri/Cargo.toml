[package]
name = "vidgrab-desktop"
version = "0.2.0"
description = "VidGrab desktop client (Phase 32C, stage C1)"
edition = "2021"
rust-version = "1.88"

[lib]
# Tauri 2 template layout: logic lives in the lib, main.rs only calls run().
name = "vidgrab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
# Local history DB; "bundled" compiles SQLite in, no system library needed.
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
# Off in C0 (unsigned installer, no updater key yet). Build with
# `--features updater` once the key pair exists (stage C2).
tauri-plugin-updater = { version = "2", optional = true }

[features]
default = []
updater = ["dep:tauri-plugin-updater"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# Session storage in Windows Credential Manager. keyring 4's `v1` API picks
# the windows-native store (keyring-core + windows-native-keyring-store) on
# Windows; it is declared for Windows only so Linux dev/test builds do not
# pull the D-Bus secret-service stack.
keyring = { version = "4", default-features = false, features = ["v1"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
