<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VidGrab - Tải video và nhạc chất lượng cao từ TikTok, YouTube, Facebook, Instagram, Spotify" />
    <title>VidGrab - Tải Video & Nhạc HD</title>
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FAFAF9" />
    <!-- Theme: set data-theme before first paint (no flash). Light is the default.
         Every storage access is wrapped: it must still render when storage throws. -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('vg-theme');
          if (saved === 'dark' || saved === 'light') theme = saved;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0E0E10' : '#FAFAF9');
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VidGrab" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.svg" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"

    />

    <meta property="og:description" content="Tải video và nhạc chất lượng cao từ TikTok, YouTube, Facebook, Instagram, Spotify. Không quảng cáo, không watermark." />
    <meta property="og:image" content="/icons/icon-512.svg" />

    <!-- Twitter Card -->
