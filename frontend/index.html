<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VidGrab - Tải video và nhạc chất lượng cao từ TikTok, YouTube, Facebook, Instagram, Spotify" />
    <title>VidGrab - Tải Video & Nhạc HD</title>
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FAFAF9" />
    <!-- Theme: set data-theme before first paint (no flash). Light is the default.
         Every storage access is wrapped: it must still render when storage throws. -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('vg-theme');
          if (saved === 'dark' || saved === 'light') theme = saved;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0E0E10' : '#FAFAF9');
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VidGrab" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="VidGrab - Tải Video & Nhạc HD Miễn Phí" />
    <meta property="og:description" content="Tải video và nhạc chất lượng cao từ TikTok, YouTube, Facebook, Instagram, Spotify. Không quảng cáo, không watermark." />
    <meta property="og:image" content="/icons/icon-512.svg" />
    <meta property="og:locale" content="vi_VN" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VidGrab - Tải Video & Nhạc HD" />
    <meta name="twitter:description" content="Tải video từ 40+ nền tảng. TikTok, YouTube, Facebook, Instagram, Spotify và nhiều hơn." />
    <link rel="canonical" href="https://dowloadvideo.io.vn/" />
  </head>
  <body>
    <!-- Security: DevTools Detection Overlay -->
    <div id="security-overlay" style="display:none;position:fixed;inset:0;z-index:99999;background:var(--vg-canvas,#FAFAF9);align-items:center;justify-content:center;flex-direction:column;gap:16px;color:var(--vg-fg,#1C1917);font-family:'Inter',system-ui,sans-serif;">
      <div style="font-size:48px;">🛡️</div>
      <h2 style="font-size:24px;font-weight:800;color:var(--vg-fg,#1C1917);">Phát hiện Developer Tools</h2>
      <p style="font-size:14px;color:var(--vg-fg-2,#57534E);max-width:400px;text-align:center;line-height:1.6;">
        Vui lòng đóng Developer Tools để tiếp tục sử dụng VidGrab.<br/>
        Hành vi phân tích mã nguồn vi phạm Điều khoản sử dụng.
      </p>
      <button onclick="document.getElementById('security-overlay').style.display='none'" style="margin-top:12px;padding:10px 32px;border-radius:12px;background:var(--vg-accent,#C9460A);color:var(--vg-accent-fg,#FFFFFF);font-weight:800;border:none;cursor:pointer;font-size:14px;">
        Tôi đã đóng DevTools
      </button>
    </div>
    <noscript>
      <div style="padding:40px;text-align:center;font-family:sans-serif;color:#1C1917;background:#FAFAF9;min-height:100vh;display:flex;align-items:center;justify-content:center;">
        <p>VidGrab yêu cầu JavaScript để hoạt động. Vui lòng bật JavaScript trong trình duyệt.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
